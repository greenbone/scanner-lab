name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-and-release:
    name: release
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.8
    - uses: actions/setup-go@v5
      with:
        go-version: '>=1.19.1'
    - name: Dependencies
      run: |
        apt-get update && apt-get --assume-yes install build-essential
        python -m pip install --upgrade pontos
    - name: Prepare
      run: |
        make prepare-release

    - name: Install git-cliff
      uses: greenbone/actions/uv@v3
      with:
        install: git-cliff

    - name: Changelog
      id: prepare_changelog
      run: |
        # Get previous tag (if exists)
        PREV_TAG=$(git tag --sort=-creatordate | grep -v "$(basename $GITHUB_REF)" | head -n1)
        # If no previous tag, use initial commit
        if [ -z "$PREV_TAG" ]; then
          RANGE=$(git rev-list --max-parents=0 HEAD)..HEAD
        else
          RANGE="$PREV_TAG..HEAD"
        fi
        # Generate changelog with git-cliff and cliff.toml configuration
        git-cliff -v --strip header -o .changelog.md --config cliff.toml --tag "$(basename $GITHUB_REF)" "$RANGE"
        # Fallback if changelog is empty
        if [ ! -s ".changelog.md" ]; then
          echo "No release notes. See commit history for details." > .changelog.md
        fi
        echo "::set-output name=RELEASE_BODY::$(cat .changelog.md)"
    - name: Upload
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release/*
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
        body: |
          ${{ steps.prepare_changelog.outputs.RELEASE_BODY }}